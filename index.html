<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apollo Hotel Header</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="header__container">
            <div class="header__logo">
                <span class="header__logo-brand">Apollo</span>
                <span class="header__logo-sub">Hotel</span>
            </div>

            <nav class="header__nav">
                <ul class="header__nav-list">
                    <li class="header__nav-item"><a href="#" class="header__nav-link">Home</a></li>
                    <li class="header__nav-item"><a href="#" class="header__nav-link">Blog</a></li>
                    <li class="header__nav-item"><a href="#" class="header__nav-link">Sobre Nós</a></li>
                </ul>
            </nav>

            <div class="header__actions">
                <button class="header__button header__button--reservation" id="btnReserva">
                    Fazer Reserva
                </button>
            </div>
        </div>
    </header>

    <script src="script.js"></script>

    <main id="main_content">
        
    </main>
</body>
</html>
