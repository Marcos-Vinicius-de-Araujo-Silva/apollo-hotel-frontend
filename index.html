<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apollo Hotel Header</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="header__container">
            <div class="header__logo">
                <span class="header__logo-brand">Apollo</span>
                <span class="header__logo-sub">Hotel</span>
            </div>

            <nav class="header__nav">
                <ul class="header__nav-list">
                    <li class="header__nav-item"><a href="#" class="header__nav-link">Home</a></li>
                    <li class="header__nav-item"><a href="#" class="header__nav-link">Blog</a></li>
                    <li class="header__nav-item"><a href="#" class="header__nav-link">Sobre Nós</a></li>
                </ul>
            </nav>

            <div class="header__actions">
                <button class="header__button header__button--reservation" id="btnReserva">
                    Fazer Reserva
                </button>
            </div>
        </div>
    </header>

    <script src="script.js"></script>

    <!-- /////////////// Home page /////////////// -->
    <main>
        <!--////////// Home1 //////////-->
        <section id="home1">
            <div id="home1--align">
                <div class="home1__h1">
                    <h1>Seu próximo hotel favorito</h1>
                </div>

                <div class="home1__h2">
                    <h2>No coração de Mônaco, torne sua viagem inesquecível</h2>
                </div>

                <div class="header__actions home1__button--align">
                    <button class="header__button header__button--reservation home1__button--enlarge" id="btnReserva">
                        Fazer Reserva
                    </button>
                </div>
            </div>
        </section>

        <!--////////// Home2 //////////-->
        <section id="home2">
            <div class="home2__title">
                <h3><i>Aproveite o melhor de Mônaco</i></h3>
            </div>

            <div class="home2__figures">
                <figure class="home2__img">
                    <div class="home2__img--image1">
                    </div>
                    <div>
                        <p>Conforto</p>
                    </div>
                </figure>

                <figure class="home2__img">
                    <div class="home2__img--image2">
                    </div>
                    <div>
                        <p>Localização</p>
                    </div>
                </figure>

                <figure class="home2__img">
                    <div class="home2__img--image3">
                    </div>
                    <div>
                        <p>Entretenimento</p>
                    </div>
                </figure>
            </div>
        </section>
    </main>
</body>
</html>
